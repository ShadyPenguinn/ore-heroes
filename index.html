<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ore Heroes</title>
<meta name="theme-color" content="#15120f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ore Heroes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Ore Heroes, Mine prototype. Same soot-and-ember look as Blacksmith Battles, its own game and its own save. */
:root{
  --bg:#15120f; --panel:#1f1a16; --panel2:#29221c; --line:#3b3029;
  --fg:#f1e8dc; --muted:#a9998a; --ember:#ff8a3d; --ember-soft:rgba(255,138,61,.16);
  --gold:#e9c45e; --good:#72d394; --ghost:#8affe0;
  --display:"Cinzel",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.card,.scene{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;box-shadow:0 10px 14px -8px rgba(0,0,0,.6)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.res.three{grid-template-columns:1fr 1fr 1fr}
.places{display:none;gap:6px;margin-bottom:8px}.places.on{display:grid;grid-template-columns:1fr 1fr}
.places .b{min-height:34px;font-family:var(--display);letter-spacing:.06em}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.chip small{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.chip.ore b{color:var(--ember)}
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0c0a09;aspect-ratio:480/210;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.taphint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;background:rgba(10,8,6,.6);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:3px 8px;pointer-events:none;transition:opacity .6s}
h2{font-family:var(--display);font-size:17px;letter-spacing:.04em;margin:0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.seg{display:flex;gap:4px}
.b{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font:600 13px var(--body);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:40px}
.b:disabled{opacity:.4;cursor:default}
.b.on{border-color:var(--ember);background:var(--ember-soft)}
.b.go{background:var(--ember);border-color:var(--ember);color:#1a120c}
.b.go:disabled{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.b.sm{min-height:34px;padding:5px 10px;font-size:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.card .pic{width:44px;height:56px;border-radius:8px;background:#0c0a09;display:grid;place-items:center;overflow:hidden}
.card .pic canvas{image-rendering:pixelated;width:44px;height:56px}
.card b{font-family:var(--display);font-size:15px;letter-spacing:.03em}
.card .lv{color:var(--ember);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.card .what{color:var(--fg);font-size:13px}
.card .next{color:var(--muted);font-size:12px}
.card .buy{display:flex;flex-direction:column;align-items:stretch;min-width:96px}
.card .buy .b{font-variant-numeric:tabular-nums}
.card.locked{opacity:.6;grid-template-columns:44px 1fr}
.card.fresh{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.note{color:var(--muted);font-size:12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--ember);border-radius:10px;padding:9px 14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.panel .row{flex-wrap:wrap;justify-content:flex-start}
.wpick{flex-wrap:wrap}.wpick .b{min-height:34px}
.fsize{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.ftrack{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.fpips{overflow:hidden;height:32px}.fpipsin{display:flex;gap:8px;transition:transform .28s ease;padding:1px}
.pip{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
.pip.p{background:var(--ember);color:#1b120b;border-color:var(--ember)}
.pip.g{background:var(--ember-soft);color:var(--ember);border-color:var(--ember)}
.pip.m{color:#e05a4a;border-color:#e05a4a}
.pip.now{border-color:var(--fg);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.track{position:relative;height:64px;border-radius:10px;background:linear-gradient(90deg,#2a1d15,#3a2416 50%,#2a1d15);border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,138,61,.28);border-left:1px solid rgba(255,170,110,.6);border-right:1px solid rgba(255,170,110,.6)}
.zone i{position:absolute;top:0;bottom:0;left:30%;width:40%;background:rgba(255,214,150,.45);box-shadow:0 0 18px rgba(255,170,90,.8)}
.marker{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.7)}
.track.idle .zone,.track.idle .marker{opacity:.25}
.tlabel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;font-weight:600;font-size:13px;color:var(--fg);pointer-events:none}
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd08a;box-shadow:0 0 6px #ff9a40;animation:spark .5s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.forge-shake{animation:fshake .18s}
@keyframes fshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.callout{display:flex;justify-content:space-between;gap:8px;min-height:22px;font-family:var(--display);font-size:15px;color:var(--ember)}
.callout b{color:var(--gold);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="res" id="res">
      <div class="chip ore"><small>Ore</small><b id="ore">0</b></div>
      <div class="chip"><small>Ore per second</small><b id="ops">0</b></div>
      <div class="chip" id="wchip" style="display:none"><small>Forged</small><b id="wpns">0</b></div>
    </div>
    <div class="places" id="places"><button class="b sm on" data-v="mine">Mine</button><button class="b sm" data-v="forge">Forge</button></div>
    <div class="scene" id="scene"><canvas id="cv" width="480" height="210"></canvas><div class="taphint" id="taphint">Tap the rock</div></div>
    <div class="ftrack" id="ftrack" style="display:none"><div class="fpips"><div class="fpipsin" id="fpips"></div></div><div class="track idle" id="track"><div class="zone" id="zone"><i></i></div><div class="marker" id="marker"></div><div class="sparks" id="sparks"></div><div class="tlabel" id="tlabel"></div></div><div class="callout" id="callout"></div></div>
  </div>
  <section class="panel fpanel" id="fpanel" style="display:none">
    <div class="row" style="justify-content:space-between"><h2>Forge</h2><span class="note" id="fstock"></span></div>
    <div class="seg wpick" id="wpick"></div>
    <div class="row frow"><span class="note">Blank</span><button class="b sm" id="fminus" aria-label="Fewer Folds">−</button><b id="fsize" class="fsize"></b><button class="b sm" id="fplus" aria-label="More Folds">+</button><span class="note" id="fcost"></span></div>
    <div class="row"><button class="b go" id="fheat">Heat blank</button><button class="b" id="fquench" style="display:none">Quench</button><span class="note" id="fbest"></span></div>
  </section>
  <div class="cards" id="cards"></div>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Save</h2><span class="note" id="backup"></span></div>
    <p class="note">This game keeps its own save, separate from Blacksmith Battles.</p>
    <div class="row"><button class="b" id="savefile">Save to file</button><button class="b" id="loadfile">Load from file</button><input type="file" id="loadinput" accept=".json,application/json" hidden><button class="b" id="reset">Start over</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const fmtN=n=>{if(n<10000)return n<100&&n%1?String(Math.round(n*10)/10):String(Math.round(n));const u=['k','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n>=100?Math.round(n):n>=10?Math.round(n*10)/10:Math.round(n*100)/100)+u[i]};
const KEY='ore-heroes-v1';

/* ---------- the mine heroes ----------
   One named hero per job, each working their own spot in the mine. Levels cost ore (base x 1.15^level).
   Milestone levels (10, 25, 50, 100, then every 50) double that hero's output and upgrade their tool. */
const MS=[25,50,100]; // first doubling at 25 (was 10): keeps the early mine small so ore still matters when the forge opens
const msCount=lv=>MS.filter(m=>lv>=m).length+(lv>=150?Math.floor((lv-100)/50):0);
const nextMs=lv=>{for(const m of MS)if(lv<m)return m;return 100+50*(Math.floor((lv-100)/50)+1)};
const TOOLS=['Copper','Iron','Steel','Moonsilver','Starmetal'];
const HEROES=[
  {k:'miner',n:'Miner',base:10,
    what:()=>`You. +${fmtN(minerTap())} ore every time you tap`,
    ms:lv=>`Level ${nextMs(lv)}: ${TOOLS[Math.min(4,msCount(lv)+1)]} pick, double ore per tap`},
  {k:'carter',n:'Carter',base:100,
    what:()=>`Rides the cart into the tunnel and back: ${fmtN(carterRate()*TRIP/timeSpeed())} ore a trip`,
    ms:lv=>`Level ${nextMs(lv)}: ${['greased wheels','a bigger cart','a second cart','iron rails'][Math.min(3,msCount(lv))]}, double loads`,
    req:()=>lv('miner')>=5&&S.taps>=25, hint:'The Miner is getting the hang of it. Keep tapping and level the Miner.'},
  {k:'phantom',n:'Phantom Pick',base:1000,
    what:()=>`A ghostly pickaxe that strikes on its own: ${fmtN(phantomRate())} ore/s`,
    ms:lv=>`Level ${nextMs(lv)}: ${['a brighter glow','a second spectral edge','twin picks','a storm of picks'][Math.min(3,msCount(lv))]}, double strikes`,
    req:()=>lv('carter')>=5&&lv('miner')>=10, hint:'Something stirs in the dark. Level the Carter and the Miner.'},
  {k:'prospector',n:'Prospector',base:8000,
    what:()=>`Swings beside you every time you swing: +${fmtN(prospTap())} ore a swing`,
    ms:lv=>`Level ${nextMs(lv)}: ${TOOLS[Math.min(4,msCount(lv)+1)]} pick, double ore`,
    req:()=>lv('phantom')>=5&&S.taps>=400, hint:'Someone is watching how you swing. Keep tapping, and level the Phantom Pick.'},
  // the Foreman (Jonathan, Nov 19): tells the Miner to swing on a timer, tapping or not. 10 s at level 1, shorter every level, no floor.
  {k:'foreman',n:'Foreman',base:25000,
    what:()=>`Blows his whistle and the Miner swings: ${foremanText()}`,
    ms:lv=>`Level ${nextMs(lv)}: ${['a louder whistle','a pocket watch that runs fast','a megaphone','a brass band'][Math.min(3,msCount(lv))]}, twice as many swings`,
    req:()=>lv('prospector')>=5&&S.taps>=1000, hint:'Your arm is getting tired. Keep tapping, and level the Prospector.'},
  {k:'blaster',n:'Blaster',base:400000,
    what:()=>`Lights a fuse every ${Math.round(BLAST/timeSpeed()*10)/10}s: ${fmtN(blasterRate()*BLAST/timeSpeed())} ore a blast`,
    ms:lv=>`Level ${nextMs(lv)}: ${['longer fuses','bigger charges','blasting jelly','thunder powder'][Math.min(3,msCount(lv))]}, double blasts`,
    req:()=>lv('foreman')>=5&&S.mined>=1e6, hint:'Big rocks need a bigger answer. Mine a lot more ore.'},
  {k:'lamp',n:'Lamplighter',base:5e6,noMs:true,
    what:()=>`+${Math.round((lampBoost()-1)*100)}% all mine ore. Keeps the mine working ${nightText()}`,
    ms:lv=>lv<12?`Next level: lanterns burn 1 more hour while you're away`:`Next level: +1% of ore kept while away`,
    req:()=>lv('blaster')>=5&&S.blasts>=10, hint:'The lanterns gutter out whenever you leave. Keep blasting.'},
  // the Time Miner (Jonathan, Nov 19): late game; shaves time off every timed hero (the Carter's trips, the Phantom Pick,
  // the Foreman's whistle, the Blaster's fuse). +3% speed per level, doubled at milestones, no ceiling.
  {k:'time',n:'Time Miner',base:1e8,noMs:true,
    what:()=>`Turns his hourglass and the whole mine hurries: everything timed runs ${Math.round(timeSpeed()*100)/100}× as fast`,
    ms:lv=>`Next level: everything timed runs 3% faster`,
    req:()=>lv('lamp')>=5&&S.mined>=1e8, hint:'Everything here takes so long. Dig deeper.'},
  /* ---------- the forge (opens when the Foreman is hired, about minute 10) ----------
     Forging is Blacksmith Battles' minigame, and it is the hook: pick a weapon and a blank size in Folds, then strike while
     the marker crosses the glow (Perfect 2 stars, Good 1, from the 5th Perfect in a row 3, 4, 5...). A miss ends the blank
     and costs a third of your stars; Quench banks the score early. Stars set the grade. Forge heroes never forge on their
     own: they make it easier (Blacksmith), cheaper (Smelter) or better (the smiths). */
  {k:'smith',n:'Blacksmith',base:3000,place:'forge',noMs:true,
    what:()=>`You. Blanks hold up to ${maxFolds()} Folds (${MATCAP} in Copper). Glow ${zoneW()}% wide, marker at ${Math.round(smithSlow()*100)}% speed`,
    ms:lv=>smithMs(lv)},
  {k:'smelter',n:'Smelter',base:15000,place:'forge',
    what:()=>`Pours ${fmtN(ingotRate()*60)} ingots a minute. A blank uses ingots (${INGOT} ore each) before ore`,
    ms:lv=>`Level ${nextMs(lv)}: ${['a bigger crucible','a second mould','a pouring channel','a river of bronze'][Math.min(3,msCount(lv))]}, double ingots`,
    req:()=>lv('smith')>=5&&S.forged>=5, hint:'Blanks eat a lot of ore. Forge 5 weapons and get the Blacksmith to level 5.'},
  {k:'axesmith',n:'Axesmith',base:1e5,place:'forge',noMs:true,w:'axe',
    what:()=>`Every Axe you forge gets +${3*lv('axesmith')}% Might and Vigor, locked in when it's forged`,
    ms:lv=>`Next level: +3% more`,
    req:()=>lv('smith')>=25, hint:'The Blacksmith learns Axes at level 25.'},
  {k:'spearwright',n:'Spearwright',base:1e6,place:'forge',noMs:true,w:'spear',
    what:()=>`Every Spear you forge gets +${3*lv('spearwright')}% Haste and Might, locked in when it's forged`,
    ms:lv=>`Next level: +3% more`,
    req:()=>lv('smith')>=50, hint:'The Blacksmith learns Spears at level 50.'},
  {k:'shieldwright',n:'Shieldwright',base:1e7,place:'forge',noMs:true,w:'shield',
    what:()=>`Every Shield you forge gets +${3*lv('shieldwright')}% Defense and Magic Defense, locked in when it's forged`,
    ms:lv=>`Next level: +3% more`,
    req:()=>lv('smith')>=75, hint:'The Blacksmith learns Shields at level 75.'},
  {k:'hammersmith',n:'Hammersmith',base:1e8,place:'forge',noMs:true,w:'hammer',
    what:()=>`Every Warhammer you forge gets +${3*lv('hammersmith')}% Might and Defense, locked in when it's forged`,
    ms:lv=>`Next level: +3% more`,
    req:()=>lv('smith')>=100, hint:'The Blacksmith learns Warhammers at level 100.'}
];
const place=h=>h.place||'mine';
const WEAP={sword:{n:'Sword',p:'Swords'},axe:{n:'Axe',p:'Axes'},spear:{n:'Spear',p:'Spears'},shield:{n:'Shield',p:'Shields'},hammer:{n:'Warhammer',p:'Warhammers'}};
// stations: the Blacksmith level that teaches the weapon (Jonathan: Axes 25, Spears 50), its smith, and the art layer
const STATIONS=[{lv:25,k:'axesmith',w:'axe'},{lv:50,k:'spearwright',w:'spear'},{lv:75,k:'shieldwright',w:'shield'},{lv:100,k:'hammersmith',w:'hammer'}];
const SWORD_LV=5; // Jonathan: you can't forge anything until the Blacksmith learns Swords at level 5
const known=()=>[...(lv('smith')>=SWORD_LV?['sword']:[]),...STATIONS.filter(st=>lv('smith')>=st.lv).map(st=>st.w)];
// Folds (Jonathan's name for slams): blanks start at 3, +1 every 5 Blacksmith levels, no ceiling; Copper holds 10
const MATCAP=10,BLANK=150,INGOT=50;
const maxFolds=()=>3+Math.floor(lv('smith')/5);
const foldLimit=()=>Math.min(MATCAP,maxFolds());
const blankCost=n=>BLANK*Math.pow(2,n-3); // a 3-Fold Copper blank is 150 ore; every Fold doubles it (as in Blacksmith Battles)
// Blacksmith milestones from Blacksmith Battles: 5/20/40 widen the glow, 10/30/50 slow the marker
const SMITH_GLOW=[5,20,40],SMITH_SLOW=[10,30,50];
const zoneW=()=>14+5*SMITH_GLOW.filter(n=>lv('smith')>=n).length;
const smithSlow=()=>1-0.07*SMITH_SLOW.filter(n=>lv('smith')>=n).length;
const ingotRate=()=>lv('smelter')?0.05*lv('smelter')*mult('smelter'):0; // ingots a second
function smithMs(L){const ev=[];for(let l=L+1;l<=L+40&&!ev.length;l++){const st=STATIONS.find(s=>s.lv===l);if(l===SWORD_LV)ev.push('learns Swords');
  if(l%5===0)ev.push(`+1 Fold`);if(SMITH_GLOW.includes(l))ev.push('a wider glow');if(SMITH_SLOW.includes(l))ev.push('a slower marker');if(st)ev.push(`learns ${WEAP[st.w].p}`);if(ev.length)return `Level ${l}: ${ev.join(', ')}`}return ''}
// grades by stars, the same 20 as Blacksmith Battles
const GR=[['Crude',0],['Fine',4],['Superior',7],['Masterwork',11],['Exalted',15],['Heroic',20],['Mythic',28],['Legendary',38],['Fabled',50],['Runebound',65],
  ['Starforged',85],['Celestial',110],['Ascendant',140],['Titanic',180],['Godforged',230],['Worldbreaker',300],['Eternal',400],['Primordial',550],['Cosmic',750],['Infinite',1000]].map(([n,at])=>({n,at}));
const GCOL=['#9a8a7a','#e8eef8','#72d394','#6ab0ff','#c08aff','#ffb347','#ff6a6a','#ffd700','#ff9ae0','#8affe0','#fff4c0','#b8d8ff','#ffe08a','#ff8a3d','#ffffff','#ff5050','#d0a0ff','#90ffb0','#a0e0ff','#ffffff'];
const gradeOf=n=>GR.reduce((g,x,i)=>n>=x.at?i:g,0);
const perfectStars=streak=>2+Math.max(0,streak-4);
const maxStars=n=>{let t=0;for(let i=1;i<=n;i++)t+=perfectStars(i);return t};
const missLoss=raw=>Math.max(3,Math.ceil(raw/3));
function scoreOf(res){let t=0,st=0;for(const r of res){if(r==='P'){st++;t+=perfectStars(st)}else{st=0;if(r==='G')t+=1}}return t}
const starMult=n=>n>=20?1.76*Math.pow(1.035,n-20):[1,1.15,1.3,1.45,1.6][[0,4,7,11,15].filter(a=>n>=a).length-1]*(1+0.02*(n-[0,4,7,11,15][[0,4,7,11,15].filter(a=>n>=a).length-1]));
const specOf=w=>(STATIONS.find(s=>s.w===w)||{}).k;
// a weapon's power: stars and its smith's bonus, locked in when forged
const powerOf=wp=>Math.round(10*starMult(wp.stars)*(1+0.03*(wp.spec||0)));
const HK=Object.fromEntries(HEROES.map(h=>[h.k,h]));
const TRIP=6,PHANTOM_EVERY=1.2,BLAST=20;
let S;
const lv=k=>S.h[k]||0;
const mult=k=>Math.pow(2,msCount(lv(k)));
/* Balance (from a play simulator, tools-free; see the PRs): never chain multipliers (the old Foreman x Miner x Prospector x
   Lamplighter x Time Miner ran to infinite ore in 10 minutes). Each hero is its own level times at most your pick; the
   Lamplighter and Time Miner add a flat amount per level. Nov 19 evening: the forge opens with the Foreman (~minute 10),
   so the early mine was slowed (first doubling at 25, Carter and Phantom Pick grow with the square root of your pick)
   to make a few hundred ore a second at that point. */
const lampBoost=()=>1+0.02*lv('lamp');
const minerTap=()=>lv('miner')*mult('miner')*lampBoost();
const prospTap=()=>minerTap()*0.25*lv('prospector')*mult('prospector');
const tapOre=()=>minerTap()+prospTap();
const timeSpeed=()=>1+0.03*lv('time');
// the Carter hauls what your pick breaks loose, so his loads grow with the Miner too
const carterRate=()=>0.5*lv('carter')*mult('carter')*Math.sqrt(minerTap())*timeSpeed();
const phantomRate=()=>1.2*lv('phantom')*mult('phantom')*Math.sqrt(minerTap())*timeSpeed();

  ctx.fillStyle='#000';ctx.fillRect(Math.round(dir>0?480*(1-k)-1:480*k-1),0,2,210);if(slide.t>=1)slide=null}
function drawForge(dt){
  ctx.save();if(shake>0){ctx.translate(Math.round((Math.random()-.5)*5*shake),Math.round((Math.random()-.5)*5*shake));shake=Math.max(0,shake-dt)}
  const bg=fatlas.sprites.bg;ctx.drawImage(fimg,bg[0],bg[1],bg[2],bg[3],-3,-3,486,216);
  glow(158,74,60+4*Math.sin(clock*3),'255,150,60',.16);
  A.fire.draw();
  // the rack: your best weapon of each kind hangs in its column, with a glint in its grade's colour
  for(const w of Object.keys(WEAP)){const b=S.best[w];if(!b)continue;sprF('w-'+w);const bx=boxF('w-'+w);if(b.g>=1)glow(bx[0]+bx[2]/2,bx[1]+bx[3]*.4,6+Math.min(10,b.g*2),hexRgb(GCOL[b.g]),.25+.08*Math.sin(clock*2+bx[0]))}
  const nx=HEROES.find(h=>place(h)==='forge'&&!lv(h.k)),isNext=k=>!!(nx&&nx.k===k&&S.seen[k]);
  for(const st of STATIONS){if(lv('smith')<st.lv)continue;sprF('st-'+st.w);const b=boxF(st.w+'-idle-0');
    if(lv(st.k))A[st.w].draw();else waitingSpot([b[0]+b[2]/2,b[1]+b[3]],isNext(st.k))}
  const ni=Math.min(9,Math.floor(S.ingots));for(let i=0;i<ni;i++)sprF('ingot',(i%3)*6+Math.floor(i/3)*3,-Math.floor(i/3)*3);
  if(lv('smelter')){A.smelter.draw();if(A.smelter.seg==='pour')glow(148,112,12,'255,180,80',.45)}else{const b=boxF('smelter-idle-0');waitingSpot([b[0]+b[2]/2,b[1]+b[3]],isNext('smelter'))}
  A.smith.draw();
  if(F)glow(ANVIL.hit[0],ANVIL.hit[1]+2,10+2*Math.sin(clock*6),'255,120,40',.45); // the hot blank
  if(A.smith.seg==='strike'||(A.smith.seg==='recover'&&A.smith.t<.08))glow(ANVIL.hit[0],ANVIL.hit[1],14,'255,200,120',.5);
  drawFx(dt);ctx.restore();
}
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
/* ---------- hero cards ---------- */
const PIC={smith:['smith-idle-0'],smelter:['smelter-idle-0'],axesmith:['axe-idle-0'],spearwright:['spear-idle-0'],shieldwright:['shield-idle-0'],hammersmith:['hammer-idle-0'],miner:['miner-idle-0',0,0,34],carter:['cart-out-16',0,0,30],phantom:['phantom-strike-4',0,0,40],prospector:['pros-idle-0',0,0,40],foreman:['boss-idle-0',0,0,26],blaster:['blast-idle-0',0,0,40],lamp:['lamp-idle-0',0,0,24],time:['time-idle-0',0,0,26]};
function portrait(h){const c=document.createElement('canvas');c.width=44;c.height=56;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const F=place(h)==='forge',[n]=PIC[h.k],s=(F?fatlas:atlas).sprites[n];const k=Math.min(44/s[2],56/s[3],1.4),w=Math.round(s[2]*k),hh=Math.round(s[3]*k);x.drawImage(F?fimg:img,s[0],s[1],s[2],s[3],Math.round((44-w)/2),56-hh,w,hh);return c}
function buildCards(){const box=$('#cards');box.innerHTML='';for(const h of HEROES){if(place(h)!==(S.view||'mine'))continue;const el=document.createElement('div');el.className='card';el.dataset.k=h.k;
  el.innerHTML=`<div class="pic"></div><div><div><b>${h.n}</b><span class="lv"></span></div><div class="what"></div><div class="next"></div></div><div class="buy"><button class="b go" data-buy="${h.k}"></button></div>`;
  el.querySelector('.pic').appendChild(portrait(h));box.appendChild(el)}refreshCards()}
function revealCheck(){for(const pl of ['mine','forge']){if(pl==='forge'&&!S.forge)continue;for(const h of HEROES){if(place(h)!==pl||S.seen[h.k])continue;if(h.req&&h.req()){S.seen[h.k]=1;toast(`Someone new came to the ${pl}: the ${h.n}`);save();refreshCards()}break}}}
function refreshCards(){let shownLocked=false;
  for(const h of HEROES){const el=document.querySelector(`.card[data-k="${h.k}"]`);if(!el)continue;const L=lv(h.k),seen=S.seen[h.k];
    if(!seen){if(shownLocked){el.style.display='none';continue}shownLocked=true;el.style.display='';el.className='card locked';el.querySelector('b').textContent='???';el.querySelector('.lv').textContent='';el.querySelector('.what').textContent=h.hint;el.querySelector('.next').textContent='';el.querySelector('.buy').style.display='none';el.querySelector('.pic').style.visibility='hidden';continue}
    el.style.display='';el.querySelector('.pic').style.visibility='';el.querySelector('.buy').style.display='';el.querySelector('b').textContent=h.n;
    el.className='card'+(L?'':' fresh');
    el.querySelector('.lv').textContent=L?`Lv ${L}`:'';
    el.querySelector('.what').textContent=L?h.what():place(h)==='forge'?`Waiting at the forge door. Hire them to start work.`:`Waiting at the mine mouth. Hire them to open their spot.`;
    el.querySelector('.next').textContent=L?h.ms(L):'';
    const n=1,c=costN(h.k,n),b=el.querySelector('button');
    b.textContent=L?`Level up${n>1?' ×'+n:''} · ${fmtN(c)}`:`Hire · ${fmtN(c)}`;b.disabled=S.ore<c}}
function buy(k){const L=lv(k),n=1,c=costN(k,n);if(S.ore<c)return;S.ore-=c;const before=msCount(L);S.h[k]=L+n;
  const st=k==='smith'&&STATIONS.find(x=>x.lv===L+n);
  if(!L)toast(`The ${HK[k].n} got to work`);
  else if(k==='smith'&&L+n===SWORD_LV){toast('You learned Swords! Heat your first blank.');refreshForge()}
  else if(st)toast(`You learned ${WEAP[st.w].p}! The ${WEAP[st.w].n} station is open`);
  else if(!HK[k].noMs&&msCount(L+n)>before)toast(`${HK[k].n} reached level ${S.h[k]}: double output!`);
  save();refreshCards()}

/* ---------- ui ---------- */
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
$('#scene').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
$('#track').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
// iPhone: fast taps must never zoom the page (double-tap zoom and pinch)
for(const ev of ['gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S.view==='forge'){e.preventDefault();tap()}});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(b)buy(b.dataset.buy)});
function refreshForge(){drawTrack();const on=S.forge&&S.view==='forge';$('#fpanel').style.display=on?'':'none';if(!on)return;
  if(!known().length){$('#wpick').innerHTML='<span class="note">No recipes yet. The Blacksmith learns Swords at level '+SWORD_LV+'.</span>'}
  const ks=known();if(!ks.includes(S.pick.w))S.pick.w='sword';S.pick.n=Math.max(1,Math.min(S.pick.n,foldLimit()));
  if(ks.length)$('#wpick').innerHTML=ks.map(w=>`<button class="b sm${w===S.pick.w?' on':''}" data-w="${w}" ${F?'disabled':''}>${WEAP[w].n}</button>`).join('');
  const n=S.pick.n,c=blankCost(n),ing=Math.min(Math.floor(S.ingots),Math.floor(c/INGOT)),ore=c-ing*INGOT;
  $('#fsize').textContent=`${n} Fold${n>1?'s':''}`;$('#fminus').disabled=!!F||n<=1;$('#fplus').disabled=!!F||n>=foldLimit();
  $('#fcost').textContent=`${fmtN(ore)} ore${ing?` + ${fmtN(ing)} ingots`:''} · best ★${maxStars(n)} ${GR[gradeOf(maxStars(n))].n}`;
  $('#fheat').style.display=F?'none':'';$('#fheat').disabled=S.ore<ore||!ks.length;$('#fheat').textContent=S.ore<ore?`Need ${fmtN(ore)} ore`:'Heat blank';
  $('#fquench').style.display=F&&!F.done&&F.res.length?'':'none';
  const b=S.best[S.pick.w];$('#fbest').textContent=F?'Tap the bar or the scene to strike':b?`Best ${WEAP[S.pick.w].n}: ${GR[b.g].n} ★${b.stars}`:'';
  $('#fstock').textContent=`${S.forged} forged${S.ingots>=1?` · ${fmtN(Math.floor(S.ingots))} ingots`:''}`}
$('#fpanel').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.w&&!F){S.pick.w=t.dataset.w}else if(t.id==='fminus'&&!F)S.pick.n--;else if(t.id==='fplus'&&!F)S.pick.n++;else if(t.id==='fheat')heat();else if(t.id==='fquench')quench();refreshForge();save()});
function setPlaces(){$('#places').classList.toggle('on',!!S.forge);$('#res').classList.toggle('three',!!S.forge);$('#wchip').style.display=S.forge?'':'none';
  if(!S.forge)S.view='mine';for(const b of $('#places').children)b.classList.toggle('on',b.dataset.v===S.view);
  const done=S.view==='forge'?fhintGone:hintGone;$('#taphint').textContent=S.view==='forge'?'Tap to heat a blank, then strike':'Tap the rock';refreshForge();$('#taphint').style.opacity=done?0:1}
$('#places').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||!S.forge||b.dataset.v===S.view)return;slide={from:S.view,t:0};S.view=b.dataset.v;pops.length=0;parts.length=0;setPlaces();buildCards();save()});
let resetArm=false;
$('#reset').onclick=()=>{if(!resetArm){resetArm=true;$('#reset').textContent='Tap again to erase this save';setTimeout(()=>{resetArm=false;$('#reset').textContent='Start over'},3000);return}S=fresh();save();setPlaces();buildCards();toast('A fresh mine')};
$('#savefile').onclick=async()=>{S.lastBackup=Date.now();save();const d=new Date(),name=`ore-heroes-save-${d.toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify({game:'ore-heroes',v:1,saved:d.toISOString(),S})],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Ore Heroes save'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
$('#loadfile').onclick=()=>$('#loadinput').click();
$('#loadinput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.game!=='ore-heroes'||!j.S)throw 0;S=Object.assign(fresh(),j.S);migrate();save();setPlaces();buildCards();toast('Save loaded')}catch(err){toast("That file isn't an Ore Heroes save")}};r.readAsText(f);e.target.value=''};

let last=0,lastSave=0,lastUi=0,hiddenAt=0;
function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;clock+=dt;
  for(const a of Object.values(A))a.step(dt);logic(dt);forgeLogic(dt);if(!S.forge&&lv('foreman'))openForge();drawScene(dt);
  if(now-lastUi>200){lastUi=now;$('#ore').textContent=fmtN(S.ore);if(S.forge){$('#wpns').textContent=fmtN(S.forged);if(S.view==='forge'&&!F)refreshForge()}$('#ops').textContent=fmtN(autoRate());revealCheck();refreshCards();$('#backup').textContent=S.lastBackup?`Last backup ${new Date(S.lastBackup).toLocaleDateString()}`:'Never backed up'}
  if(now-lastSave>5000){lastSave=now;save()}
  requestAnimationFrame(frame)}
// closing or hiding the page counts as away time: only the Lamplighter earns while you're gone
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(hiddenAt){awayGrant((Date.now()-hiddenAt)/1000);hiddenAt=0;last=0}});
window.addEventListener('pagehide',save);

load();
const pic=src=>new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=src});
Promise.all([fetch('art/mine.json').then(r=>r.json()),pic('art/mine.png'),fetch('art/forge.json').then(r=>r.json()),pic('art/forge.png')]).then(([a,i,fa,fi])=>{atlas=a;img=i;fatlas=fa;fimg=fi;
  A.miner=new Actor('miner',e=>{if(e==='strike')minerLanded()});A.pros=new Actor('pros',e=>{if(e==='strike')prospLanded()});
  A.phantom=new Actor('phantom',e=>{if(e==='strike'){gain(phantomRate()*PHANTOM_EVERY,SPOT.phantom.pop,'#b8fff0');burst(SPOT.phantom.hit,6,['#8affe0','#d88038','#f0b070'],.7)}});
  A.boss=new Actor('boss');A.blast=new Actor('blast');A.lamp=new Actor('lamp');A.time=new Actor('time');
  A.smith=new Actor('smith',null,true);A.fire=new Actor('fire',null,true);
  A.smelter=new Actor('smelter',e=>{if(e==='pour')smelterPoured()},true);
  for(const st of STATIONS)A[st.w]=new Actor(st.w,null,true);
  if(S.forged)fhintGone=true;setPlaces();
  awayGrant((Date.now()-(S.t||Date.now()))/1000);S.seen.miner=1;if(S.taps>=3){hintGone=true;$('#taphint').style.opacity=0}
  buildCards();requestAnimationFrame(frame)});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
