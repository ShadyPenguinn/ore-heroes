<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ore Heroes</title>
<meta name="theme-color" content="#15120f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ore Heroes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Ore Heroes, Mine prototype. Same soot-and-ember look as Blacksmith Battles, its own game and its own save. */
:root{
  --bg:#15120f; --panel:#1f1a16; --panel2:#29221c; --line:#3b3029;
  --fg:#f1e8dc; --muted:#a9998a; --ember:#ff8a3d; --ember-soft:rgba(255,138,61,.16);
  --gold:#e9c45e; --good:#72d394; --ghost:#8affe0;
  --display:"Cinzel",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.card,.scene{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;box-shadow:0 10px 14px -8px rgba(0,0,0,.6)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.res.three{grid-template-columns:1fr 1fr 1fr}
.places{display:none;gap:6px;margin-bottom:8px}.places.on{display:grid;grid-template-columns:1fr 1fr}.places.three{grid-template-columns:1fr 1fr 1fr}.places.four{grid-template-columns:1fr 1fr 1fr 1fr}
.places .b.dot{position:relative}.places .b.dot::after{content:'';position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px var(--ember)}
.places .b{min-height:34px;font-family:var(--display);letter-spacing:.06em}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.chip small{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.chip.ore b{color:var(--ember)}
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0c0a09;aspect-ratio:480/250;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.scene #cv,.scene #bgl{inset:auto;left:0;top:0}
/* behind the stage: the mine's cave, blurred and dimmed, filling the rest of a taller box */
.scene #bd{object-fit:cover;filter:blur(7px) brightness(.5);transform:scale(1.15);transition:opacity .3s}
/* phones: the art runs edge to edge */
@media (max-width:600px){.scene{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0;border-left:0;border-right:0}}
/* full view: the art fills the screen; tapping still works, the corner button comes back */
.scene.full{position:fixed;inset:0;margin:0;z-index:50;aspect-ratio:auto;border:0;border-radius:0}
.fvbtn{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(10,8,6,.55);color:var(--fg);display:grid;place-items:center;padding:0;cursor:pointer;z-index:3}
.scene.full .fvbtn{top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px}
.fvbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fvore{display:none;position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:3;pointer-events:none;background:rgba(10,8,6,.55);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:4px 10px;font:700 16px var(--body);color:var(--ember);font-variant-numeric:tabular-nums}
.fvore small{display:block;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.scene.full .fvore{display:block}
.fvturn{display:none;position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;pointer-events:none;font:600 12px var(--body);color:var(--muted);background:rgba(10,8,6,.55);border-radius:8px;padding:4px 10px;z-index:3}
@media (orientation:portrait){.scene.full .fvturn{display:block}}
body.fv{overflow:hidden}
.taphint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;background:rgba(10,8,6,.6);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:3px 8px;pointer-events:none;transition:opacity .6s}
h2{font-family:var(--display);font-size:17px;letter-spacing:.04em;margin:0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.seg{display:flex;gap:4px}
.b{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font:600 13px var(--body);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:40px}
.b:disabled{opacity:.4;cursor:default}
.b.on{border-color:var(--ember);background:var(--ember-soft)}
.b.go{background:var(--ember);border-color:var(--ember);color:#1a120c}
.b.go:disabled{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.b.sm{min-height:34px;padding:5px 10px;font-size:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.card .pic{width:44px;height:56px;border-radius:8px;background:#0c0a09;display:grid;place-items:center;overflow:hidden}
.card .pic canvas,.card .pic img{image-rendering:pixelated;width:44px;height:56px}
img.ico3d{image-rendering:auto!important;object-fit:contain}
.card b{font-family:var(--display);font-size:13px;letter-spacing:.01em}
.card .lv{color:var(--ember);font-weight:700;font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.card .line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.locked .line{white-space:normal}
.card .what{color:var(--fg);font-size:12px;font-weight:600;margin-left:5px}
.card.locked .what{display:block;margin:2px 0 0;white-space:normal;font-weight:400}
.card .buy{display:flex;flex-direction:column;align-items:stretch;min-width:66px}
.card .buy .b{padding-left:8px;padding-right:8px}
.card .buy .b{font-variant-numeric:tabular-nums}
.card.locked{opacity:.6;grid-template-columns:44px 1fr}
.card.fresh{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
/* a hero you can hire for the first time: the portrait pulses until you hire them; the place they joined pulses until you go there */
@keyframes newPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,140,60,0);filter:none}50%{box-shadow:0 0 0 2px var(--ember),0 0 14px 2px rgba(255,140,60,.75);filter:brightness(1.35)}}
.card.fresh .pic{animation:newPulse 1.1s ease-in-out infinite}
/* hired but never customised: the portrait pulses teal until you open it */
@keyframes lookPulse{0%,100%{box-shadow:0 0 0 0 rgba(90,220,200,0);filter:none}50%{box-shadow:0 0 0 2px #5adcc8,0 0 14px 2px rgba(90,220,200,.7);filter:brightness(1.3)}}
.card.lookme .pic{animation:lookPulse 1.3s ease-in-out infinite}
.places .b.flash{animation:newPulse 1.1s ease-in-out infinite;border-color:var(--ember)}
.note{color:var(--muted);font-size:12px;margin:0}
.toast{position:fixed;z-index:200;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--ember);border-radius:10px;padding:9px 14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* customise a mine hero: tap the portrait */
.card.cust{cursor:pointer}.card.cust .pic{position:relative;cursor:pointer}
.lookbg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.lookbg.on{display:flex}
.lookbox{width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lookhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.lookhead .pv{width:88px;height:112px;border-radius:10px;background:#0c0a09;display:grid;place-items:center;overflow:hidden;flex:none}
.lookhead .pv img{width:88px;height:112px}
.lookhead b{font-size:18px;display:block;line-height:1.15}
.lookhead .ldesc{margin:2px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}
.lookrow{margin-top:10px}
.lookrow+.lookrow{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lookrow small{display:block;color:var(--muted);margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0;cursor:pointer}
.sw button.on{border-color:#ffd27a;box-shadow:0 0 0 2px rgba(255,210,122,.35)}
.sw button.def{background:#2a221c;color:#d8d0c0;font-size:15px}
.lookdone{margin-top:14px;width:100%}
.b.lookme{animation:lookPulse 1.3s ease-in-out infinite;border-color:#5adcc8}
.hname{width:100%;box-sizing:border-box;font:inherit;font-size:17px;font-weight:700;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:#14100e;color:inherit}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts .b{padding:6px 10px;min-height:0}.opts .b.on{border-color:#ffd27a;color:#ffd27a}
.lookhead canvas{width:88px;height:112px;image-rendering:pixelated}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.panel .row{flex-wrap:wrap;justify-content:flex-start}
.ftrack{margin-top:8px;display:flex;flex-direction:column;gap:6px}
/* five circles wide; before a blank they pick its Folds (lower counts scroll off to the left), while forging they show the strikes */
.fpips{overflow:hidden;height:32px;width:186px;flex:none;scrollbar-width:none}.fpips::-webkit-scrollbar{display:none}.fpips.pickf{overflow-x:auto;touch-action:pan-x}.fpipsin{display:flex;gap:8px;transition:transform .28s ease;padding:1px}
.pip{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
.pip.p{background:var(--ember);color:#1b120b;border-color:var(--ember)}
.pip.g{background:var(--ember-soft);color:var(--ember);border-color:var(--ember)}
.pip.m{color:#e05a4a;border-color:#e05a4a}
.pip.now{border-color:var(--fg);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.track{position:relative;height:64px;border-radius:10px;background:linear-gradient(90deg,#2a1d15,#3a2416 50%,#2a1d15);border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,138,61,.28);border-left:1px solid rgba(255,170,110,.6);border-right:1px solid rgba(255,170,110,.6)}
.zone i{position:absolute;top:0;bottom:0;left:30%;width:40%;background:rgba(255,214,150,.45);box-shadow:0 0 18px rgba(255,170,90,.8)}
.marker{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.7)}
.track.idle .zone,.track.idle .marker{opacity:.25}
.tlabel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;font-weight:600;font-size:13px;color:var(--fg);pointer-events:none}
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd08a;box-shadow:0 0 6px #ff9a40;animation:spark .5s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.forge-shake{animation:fshake .18s}
@keyframes fshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ftop{display:flex;align-items:center;gap:8px}.fcost{flex:1;min-width:0;font:600 13px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fcost.short{color:#e05a4a}
.pip.f{cursor:pointer;color:var(--muted)}.pip.f.in{background:var(--ember-soft);color:var(--ember);border-color:rgba(255,140,60,.45)}.pip.f.sel{background:var(--ember);color:#1b120b;border-color:var(--ember);box-shadow:0 0 0 2px rgba(255,140,60,.3)}
/* the recipes, in a row along the bottom left of the art */
.fweap{position:absolute;left:6px;bottom:6px;z-index:3;display:none;flex-direction:row;gap:4px}.fweap.on{display:flex}
.fweap button{width:var(--wb,38px);height:var(--wb,38px);padding:0;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(10,8,6,.55);display:grid;place-items:center;cursor:pointer}
.fweap button.on{border-color:var(--ember);background:rgba(90,45,20,.7);box-shadow:0 0 0 1px var(--ember)}.fweap button:disabled{opacity:.55;cursor:default}.fweap button.on:disabled{opacity:1}
.fweap img{width:calc(var(--wb,38px) - 6px);height:calc(var(--wb,38px) - 6px);image-rendering:pixelated}
.scene.full .fweap{bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px))}
.fact{min-width:92px;min-height:34px;flex:none;margin-left:auto}
/* the stars of the blank on the anvil, on the art just above the Perfect / Good / Miss line */
.fvstars{position:absolute;left:0;right:0;padding-left:var(--fwr,0px);bottom:22px;line-height:1.1;text-align:center;font:700 17px var(--display);color:var(--gold);text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.9);pointer-events:none;opacity:0;transition:opacity .25s}.fvstars.on{opacity:1}
.fresult{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;text-align:center;font:700 14px var(--display);color:var(--ember);background:linear-gradient(transparent,rgba(10,8,6,.85) 45%);pointer-events:none;opacity:0;transition:opacity .25s}
.fresult.on{opacity:1}
.apanel h3{margin:0;font:700 17px var(--display);letter-spacing:.04em}
.ahead{display:flex;align-items:center;gap:10px}.ahead .grow{flex:1;min-width:0}
.aw{display:flex;gap:10px;align-items:center}.aw .ic{flex:0 0 auto;width:56px;height:56px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.aw .ic canvas,.aw .ic img{width:48px;height:48px;image-rendering:pixelated}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:13px}.stats span{color:var(--muted)}.stats b{float:right;font-variant-numeric:tabular-nums}
.stats .up{color:#72d394}.stats .dn{color:#e05a4a}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.wgrid .b{height:66px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.wgrid canvas,.wgrid img{width:40px;height:40px;image-rendering:pixelated}.wgrid small{font-size:11px;font-weight:700}
.wgrid .held{position:absolute;top:2px;right:4px;font-size:10px;color:var(--muted)}
.b.wbtn{width:52px;height:44px;padding:0;display:grid;place-items:center}.wbtn canvas,.wbtn img{width:40px;height:40px;image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="res" id="res">
      <div class="chip ore"><small>Ore</small><b id="ore">0</b></div>
      <div class="chip"><small>Ore per second</small><b id="ops">0</b></div>
      <div class="chip" id="wchip" style="display:none"><small>Forged</small><b id="wpns">0</b></div>
    </div>
    <div class="places" id="places"><button class="b sm on" data-v="mine">Mine</button><button class="b sm" data-v="forge">Forge</button><button class="b sm" data-v="army" style="display:none">Heroes</button><button class="b sm" data-v="explore" style="display:none">Explore</button></div>
    <div class="scene" id="scene"><canvas id="bd" width="480" height="210" aria-hidden="true"></canvas><canvas id="bgl" width="960" height="420" aria-hidden="true"></canvas><canvas id="cv" width="960" height="420"></canvas><div class="taphint" id="taphint">Click the rock</div><div class="fweap" id="fweap"></div><div class="fvstars" id="fvstars"></div><div class="fresult" id="fresult" style="padding-left:calc(var(--fwr,0px) + 10px)"></div><div class="fresult" id="xresult"></div><div class="fvore"><small>Ore</small><span id="fvore">0</span></div><div class="fvturn">Turn sideways for the biggest view</div><button class="fvbtn" id="fvbtn" aria-label="Full view"></button></div>
    <div class="ftrack" id="ftrack" style="display:none"><div class="ftop"><div class="fpips" id="fpipbox"><div class="fpipsin" id="fpips"></div></div><span class="fcost" id="fcost"></span><button class="b go fact" id="fact">Heat</button></div><div class="track idle" id="track"><div class="zone" id="zone"><i></i></div><div class="marker" id="marker"></div><div class="sparks" id="sparks"></div><div class="tlabel" id="tlabel"></div></div></div>
  </div>
  <section class="panel apanel" id="apanel" style="display:none"></section>
  <section class="panel apanel" id="xpanel" style="display:none"></section>
  <div class="cards" id="cards"></div>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Save</h2><span class="note" id="backup"></span></div>
    <p class="note">This game keeps its own save, separate from Blacksmith Battles.</p>
    <div class="row"><button class="b" id="savefile">Save to file</button><button class="b" id="loadfile">Load from file</button><input type="file" id="loadinput" accept=".json,application/json" hidden><button class="b" id="reset">Start over</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="lookbg" id="lookbg"><div class="lookbox" id="lookbox"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const fmtN=n=>{if(n<10000)return n<100&&n%1?String(Math.round(n*10)/10):String(Math.round(n));const u=['k','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n>=100?Math.round(n):n>=10?Math.round(n*10)/10:Math.round(n*100)/100)+u[i]};
const KEY='ore-heroes-v1';

/* ---------- the mine heroes ----------
   One named hero per job, each working their own spot in the mine. Levels cost ore (base x 1.15^level).
   Milestone levels (10, 25, 50, 100, then every 50) double that hero's output and upgrade their tool. */
const MS=[25,50,100]; // first doubling at 25 (was 10): keeps the early mine small so ore still matters when the forge opens
const msCount=lv=>MS.filter(m=>lv>=m).length+(lv>=150?Math.floor((lv-100)/50):0);
const nextMs=lv=>{for(const m of MS)if(lv<m)return m;return 100+50*(Math.floor((lv-100)/50)+1)};
const TOOLS=['Copper','Iron','Steel','Moonsilver','Starmetal'];
// the word for pressing: 'click' everywhere for now; a phone build can set it to 'tap' (Jonathan, Nov 21)
const TAP='click',Tap=TAP[0].toUpperCase()+TAP.slice(1),TAPPING=TAP==='tap'?'tapping':TAP+'ing';
const HEROES=[
  {k:'miner',n:'Miner',base:10,
    what:()=>`+${fmtN(minerTap())}/${TAP}`,
    desc:()=>`Swings his pick every time you ${TAP}, for +${fmtN(minerTap())} ore a ${TAP}.`,
    ms:lv=>`Level ${nextMs(lv)}: ${TOOLS[Math.min(4,msCount(lv)+1)]} pick, double ore per ${TAP}`},
  {k:'carter',n:'Carter',base:100,
    what:()=>`+${fmtN(carterRate()*TRIP/timeSpeed())}/trip`,
    desc:()=>`Rides the cart into the tunnel and back, bringing ${fmtN(carterRate()*TRIP/timeSpeed())} ore a trip.`,
    ms:lv=>`Level ${nextMs(lv)}: ${['greased wheels','a bigger cart','a second cart','iron rails'][Math.min(3,msCount(lv))]}, double loads`,
    req:()=>lv('miner')>=5&&S.taps>=25, hint:`The Miner is getting the hang of it. Keep ${TAPPING} and level the Miner.`},
  {k:'phantom',n:'Phantom Miner',base:1000,
    what:()=>`+${fmtN(phantomRate())}/s`,
    desc:()=>`A ghost miner who still works the rock, digging ${fmtN(phantomRate())} ore a second.`,
    ms:lv=>`Level ${nextMs(lv)}: ${['a brighter glow','a second spectral edge','twin picks','a storm of picks'][Math.min(3,msCount(lv))]}, double strikes`,

let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
$('#scene').addEventListener('pointerdown',e=>{e.preventDefault();if(S.view==='explore')return;if(S.view==='army'){const r=$('#cv').getBoundingClientRect();armyTap((e.clientX-r.left)/r.width*480,(e.clientY-r.top)/r.height*210);return}tap()});
$('#track').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
/* the art box: the game draws on a 480x210 stage; the box may be taller (or, in full view, any shape), so the stage is scaled to fit,
   cropping a little off the sides at most, and the 3D scenes fill the rest of the box with more cave above and below */
const ICON_FULL='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',ICON_SHUT='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
window.SCN={w:480,h:210,s:1,v:0};
function layoutScene(){const box=$('#scene'),cv=$('#cv'),w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
  const full=box.classList.contains('full'),s=Math.min(Math.max(w/480,h/210),w/480*(full?1.3:1.06)),cw=480*s,ch=210*s;
  box.style.setProperty('--wb',Math.max(26,Math.min(40,Math.floor((w-12-16)/10)))+'px');for(const c of [cv,$('#bgl')])Object.assign(c.style,{width:cw+'px',height:ch+'px',left:(w-cw)/2+'px',top:(h-ch)/2+'px'});window.SCN={w,h,s,v:window.SCN.v+1}}
function setFull(on){$('#scene').classList.toggle('full',on);document.body.classList.toggle('fv',on);$('#fvbtn').innerHTML=on?ICON_SHUT:ICON_FULL;$('#fvbtn').setAttribute('aria-label',on?'Leave full view':'Full view');layoutScene()}
$('#fvbtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();setFull(!$('#scene').classList.contains('full'))});
new ResizeObserver(layoutScene).observe($('#scene'));setFull(false);
// iPhone: fast taps must never zoom the page (double-tap zoom and pinch)
for(const ev of ['gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S.view==='forge'){e.preventDefault();tap()}});
// a click anywhere on a hired hero's card opens their customising, except on the level-up button or within a finger's width of it
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(b)return buy(b.dataset.buy);const card=e.target.closest('.card.cust');if(!card)return;
  const r=card.querySelector('[data-buy]').getBoundingClientRect(),m=14;if(r.width&&e.clientX>=r.left-m&&e.clientX<=r.right+m&&e.clientY>=r.top-m&&e.clientY<=r.bottom+m)return;openLook(card.dataset.k)});
function refreshForge(){const on=S.forge&&S.view==='forge'&&!slide,fw=$('#fweap'),ks=on?known():[];if(S.forge&&!F){if(!known().includes(S.pick.w))S.pick.w='sword';S.pick.n=S.pick.auto!==false?foldLimit():Math.max(1,Math.min(S.pick.n,foldLimit()))}
  drawTrack();fw.classList.toggle('on',on&&ks.length>0);if(!on)return;
  // the column is built once per set of recipes; after that only its highlight and disabled state change, so the icons never reload (they blinked)
  const wk=ks.join(',');if(fw.dataset.k!==wk){fw.dataset.k=wk;fw.innerHTML=ks.map(w=>`<button data-w="${w}" aria-label="${WEAP[w].n}"></button>`).join('');for(const b of fw.children)b.appendChild(weaponIcon(b.dataset.w))}
  for(const b of fw.children){b.classList.toggle('on',b.dataset.w===S.pick.w);b.disabled=!!F}
  // the Perfect line and the stars centre in the room to the right of the row
  const fwr=(fw.offsetWidth?fw.offsetLeft+fw.offsetWidth+4:0)+'px';if($('#scene').style.getPropertyValue('--fwr')!==fwr)$('#scene').style.setProperty('--fwr',fwr);
}
function weaponIcon(w){return icon3d('w-'+w,40,40)}
$('#fact').addEventListener('click',()=>{if(F)quench();else heat();refreshForge()});
$('#fweap').addEventListener('pointerdown',e=>e.stopPropagation());
$('#fweap').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||F)return;S.pick.w=t.dataset.w;refreshForge();save()});
// a fold circle picks the blank's size; the highest keeps following the Blacksmith's limit as he levels
$('#fpipbox').addEventListener('click',e=>{const t=e.target.closest('.pip.f');if(!t||F)return;const k=+t.dataset.n;S.pick.n=k;S.pick.auto=k>=foldLimit();refreshForge();save()});
function setPlaces(){$('#places').classList.toggle('on',!!S.forge);$('#res').classList.toggle('three',!!S.forge);$('#wchip').style.display=S.forge?'':'none';
  if(!S.forge)S.view='mine';if(!S.army&&S.view==='army')S.view='mine';if(!S.explore&&S.view==='explore')S.view='mine';$('#places').classList.toggle('three',!!S.army&&!S.explore);$('#places').classList.toggle('four',!!S.explore);$('[data-v=army]').style.display=S.army?'':'none';$('[data-v=explore]').style.display=S.explore?'':'none';
  if(S.notice)delete S.notice[S.view];for(const b of $('#places').children){b.classList.toggle('on',b.dataset.v===S.view);b.classList.toggle('flash',!!(S.notice&&S.notice[b.dataset.v]))}refreshArmy();refreshExplore();
  const done=S.view==='forge'?fhintGone:hintGone;$('#taphint').textContent=S.view==='forge'?`${Tap} to heat a blank, then strike`:`${Tap} the rock`;refreshForge();$('#taphint').style.opacity=done||S.view==='army'||S.view==='explore'?0:1}
$('#places').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||!S.forge||b.dataset.v===S.view)return;slide={from:S.view,t:0};S.view=b.dataset.v;amode='hero';pops.length=0;parts.length=0;setPlaces();buildCards();save()});
let resetArm=false;
$('#reset').onclick=()=>{if(!resetArm){resetArm=true;$('#reset').textContent=`${Tap} again to erase this save`;setTimeout(()=>{resetArm=false;$('#reset').textContent='Start over'},3000);return}S=fresh();save();setPlaces();buildCards();toast('A fresh mine')};
$('#savefile').onclick=async()=>{S.lastBackup=Date.now();save();const d=new Date(),name=`ore-heroes-save-${d.toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify({game:'ore-heroes',v:1,saved:d.toISOString(),S})],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Ore Heroes save'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
$('#loadfile').onclick=()=>$('#loadinput').click();
$('#loadinput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.game!=='ore-heroes'||!j.S)throw 0;S=Object.assign(fresh(),j.S);migrate();save();setPlaces();buildCards();toast('Save loaded')}catch(err){toast("That file isn't an Ore Heroes save")}};r.readAsText(f);e.target.value=''};

let last=0,lastSave=0,lastUi=0,hiddenAt=0,lastDraw=0,drawDt=0;
function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;clock+=dt;
  for(const a of Object.values(A))a.step(dt);logic(dt);forgeLogic(dt);exploreLogic(dt);if(!S.forge&&lv('foreman'))openForge();
  // the scene repaints at most 30 times a second: the heroes animate at 12 frames a second, so 60 repaints only spend battery
  drawDt+=dt;if(now-lastDraw>=31||slide){lastDraw=now;drawScene(drawDt);drawDt=0}
  if(now-lastUi>200){lastUi=now;$('#ore').textContent=$('#fvore').textContent=fmtN(S.ore);if(S.forge){$('#wpns').textContent=fmtN(S.forged);if(S.view==='forge'&&!F)refreshForge()}$('#ops').textContent=fmtN(autoRate());revealCheck();refreshCards();$('#backup').textContent=S.lastBackup?`Last backup ${new Date(S.lastBackup).toLocaleDateString()}`:'Never backed up'}
  if(now-lastSave>5000){lastSave=now;save()}
  requestAnimationFrame(frame)}
// closing or hiding the page counts as away time: only the Lamplighter earns while you're gone
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(hiddenAt){awayGrant((Date.now()-hiddenAt)/1000);hiddenAt=0;last=0}});
window.addEventListener('pagehide',save);

load();
const pic=src=>new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=src});
const mineSlots=pic('art/mine-slots.png').catch(()=>null),forgeSlots=pic('art/forge-slots.png').catch(()=>null),campSlots=pic('art/camp-slots.png').catch(()=>null);
Promise.all([fetch('art/mine.json').then(r=>r.json()),pic('art/mine.png'),fetch('art/forge.json').then(r=>r.json()),pic('art/forge.png'),fetch('art/camp.json').then(r=>r.json()),pic('art/camp.png'),fetch('art/explore.json').then(r=>r.json()),pic('art/explore.png')]).then(([a,i,fa,fi,aa,ai,xa,xi])=>{
  // an atlas drawn at 1/k: [sx, sy, sw, sh, x, y] gets its place and size on the stage as [.., x/k, y/k, sw/k, sh/k]
  for(const at of [a,fa,aa]){const k=at.k||1;for(const s of Object.values(at.sprites)){s[6]=s[2]/k;s[7]=s[3]/k;s[4]/=k;s[5]/=k}}
  atlas=a;img=i;fatlas=fa;fimg=fi;lookReady=Promise.all([mineSlots,forgeSlots]).then(([sm,sf])=>{if(sm&&a.slots)img=lookInit('mine',i,sm,a);if(sf&&fa.slots)fimg=lookInit('forge',fi,sf,fa);for(const k in S.look||{})lookApply(k);buildCards()});
  // the camp: its fire's place for the glow; heroes are recoloured from a CPU copy of the atlas into canvases of their own
  catlas=aa;cimg=ai;{const f=aa.sprites[aa.heroes.fire.idle.f[0]];aa.fire=[f[4]+f[6]/2,f[5]+f[7]]}campSlots.then(sc=>{if(sc&&aa.slots){lookInit('camp',ai,sc,aa);hcache.length=0}});xatlas=xa;ximg=xi;
  A.miner=new Actor('miner',e=>{if(e==='strike')minerLanded()});A.pros=new Actor('pros',e=>{if(e==='strike')prospLanded()});
  A.phantom=new Actor('phantom',e=>{if(e==='strike'){const g=ghostTint();gain(phantomRate()*PHANTOM_EVERY,SPOT.phantom.pop,g.pop);burst(SPOT.phantom.hit,6,[g.spark,'#d88038','#f0b070'],.7)}});
  A.boss=new Actor('boss');A.blast=new Actor('blast');A.lamp=new Actor('lamp');A.time=new Actor('time');
  A.smith=new Actor('smith',null,true);A.fire=new Actor('fire',null,true);
  for(const st of STATIONS)A[st.w]=new Actor(st.w,null,true);
  if(S.forged)fhintGone=true;setPlaces();
  awayGrant((Date.now()-(S.t||Date.now()))/1000);S.seen.miner=1;if(S.taps>=3){hintGone=true;$('#taphint').style.opacity=0}
  buildCards();requestAnimationFrame(frame)});
</script>
